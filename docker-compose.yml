version: '3.8'

services:
  agroadmin:
    image: ${DOCKER_REGISTRY-}agroadmin
    build:
      context: .
      dockerfile: AgroAdmin/AgroAdmin/Dockerfile
    container_name: agro_admin_api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Server=db;Database=AgroAdminDb;User Id=sa;Password=YourStrong!Password;TrustServerCertificate=True;MultipleActiveResultSets=true
      - Telegram__BotToken=
      - Telegram__ChatId=
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - agro_network
    volumes:
      - agro_keys:/root/.aspnet/DataProtection-Keys
    user: root

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: agro_mssql
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong!Password
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - agro_mssql_data:/var/opt/mssql
    networks:
      - agro_network
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "YourStrong!Password" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  agro_network:
    driver: bridge

volumes:
  agro_mssql_data:
  agro_keys: