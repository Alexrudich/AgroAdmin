name: Build, publish and deploy to MonsterASP.NET

on:
  workflow_dispatch

jobs:
  build_and_deploy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          
      - name: Install dependencies
        # Восстанавливаем зависимости всего решения, чтобы видеть Domain/Shared
        run: dotnet restore AgroAdmin.sln 
        
      - name: Build
        run: dotnet build AgroAdmin.sln --configuration Release --no-restore

      - name: Publish
        # Публикуем основной проект сервера в папку ./publish-folder
        run: dotnet publish AgroAdmin/AgroAdmin/AgroAdmin.csproj --configuration Release --output ./publish-folder --runtime win-x86 --no-self-contained

      - name: Deploy to MonsterASP.NET
        # Используем официальный экшен от Azure/Microsoft, он лучше жует профили
        uses: azure/webapps-deploy@v3
        with:
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish-folder
          # clean: true попробует очистить wwwroot перед записью
          clean: true 
