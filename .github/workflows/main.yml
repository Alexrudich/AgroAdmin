name: Build, publish and deploy to MonsterASP.NET

on:
  workflow_dispatch

jobs:
  build_and_deploy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          
      - name: Install dependencies
        run: dotnet restore AgroAdmin/AgroAdmin/AgroAdmin.csproj
        
      - name: Build
        run: dotnet build AgroAdmin/AgroAdmin/AgroAdmin.csproj --configuration Release --no-restore

      - name: Publish
        # Собираем файлы в папку для деплоя
        run: dotnet publish AgroAdmin/AgroAdmin/AgroAdmin.csproj --configuration Release --output ./publish-folder --runtime win-x86 --no-self-contained
        
      - name: Deploy to MonsterASP.NET via WebDeploy
        # Используем нативный msdeploy.exe (как в Visual Studio)
        # Параметр -verb:sync и -allowUntrusted:true решают проблемы с сертификатом и очисткой
        run: |
          "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe" `
          -verb:sync `
          -source:package='${{ github.workspace }}\publish-folder' `
          -dest:auto,computerName='https://site57408.siteasp.net' `
          -allowUntrusted:true `
          -enableRule:AppOffline `
          -retryAttempts:3
