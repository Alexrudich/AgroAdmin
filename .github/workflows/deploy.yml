name: Build and Deploy to MonsterASP.NET

on:
  # push:
  #   branches: [ develop ]
  workflow_dispatch: # Оставляем ручной запуск кнопкой для отладки

jobs:
  build_and_deploy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: Restore dependencies
        run: dotnet restore AgroAdmin.slnx

      - name: Build
        run: dotnet build AgroAdmin.slnx --configuration Release --no-restore

      - name: Publish
        run: dotnet publish AgroAdmin/AgroAdmin/AgroAdmin.csproj --configuration Release --output ./publish --runtime win-x86 --self-contained false

      - name: Deploy to MonsterASP via MSDeploy
        shell: pwsh
        run: |
          $publishPath = "${{ github.workspace }}\publish"
          $msDeployPath = "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          
          # Прямой вызов движка WebDeploy с параметрами из твоего профиля (.publishsettings)
          & $msDeployPath `
            -verb:sync `
            -source:contentPath="$publishPath" `
            -dest:contentPath='${{ secrets.WEBSITE_NAME }}',ComputerName='${{ secrets.SERVER_COMPUTER_NAME }}',UserName='${{ secrets.SERVER_USERNAME }}',Password='${{ secrets.SERVER_PASSWORD }}',AuthType='Basic' `
            -allowUntrusted `
            -enableRule:DoNotDeleteRule
