name: Build and Deploy to MonsterASP.NET (FTP)

on:
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore & Build
        run: |
          dotnet restore AgroAdmin.slnx
          dotnet build AgroAdmin.slnx --configuration Release --no-restore

      - name: Publish
        run: dotnet publish AgroAdmin/AgroAdmin/AgroAdmin.csproj --configuration Release --output ./publish --runtime win-x86 --self-contained false

      # Создаем файл-заглушку локально
      - name: Create Offline File
        run: echo "Site is updating..." > ./publish/app_offline.htm

      # Деплоим ВСЁ (включая app_offline.htm первым делом)
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: ./wwwroot/

      # Удаляем заглушку, чтобы сайт запустился
      # Используем простой скрипт для удаления одного файла через FTP
      - name: Put Site Online (Remove app_offline.htm)
        shell: pwsh
        run: |
          $ftp = [System.Net.FtpWebRequest]::Create("ftp://${{ secrets.FTP_SERVER }}/wwwroot/app_offline.htm")
          $ftp.Method = [System.Net.WebRequestMethods+Ftp]::DeleteFile
          $ftp.Credentials = New-Object System.Net.NetworkCredential("${{ secrets.FTP_USERNAME }}", "${{ secrets.FTP_PASSWORD }}")
          try { $ftp.GetResponse().Close() } catch { Write-Host "File already gone or error: $_" }
