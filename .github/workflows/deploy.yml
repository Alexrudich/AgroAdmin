name: Build and Deploy to MonsterASP.NET (FTP)

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Clear NuGet cache
        run: dotnet nuget locals all --clear

      - name: Restore & Build
        run: |
          dotnet restore AgroAdmin.slnx --no-cache
          dotnet build AgroAdmin.slnx --configuration Release --no-restore

      - name: Publish
        run: |
          dotnet publish AgroAdmin/AgroAdmin/AgroAdmin.csproj `
            --configuration Release `
            --output ./publish `
            --runtime win-x86 `
            --self-contained true `
            -p:UseAppHost=false

      # ШАГ 1: Создаем и заливаем ТОЛЬКО app_offline.htm
      - name: Put Site Offline
        shell: pwsh
        run: |
          $offlineFile = "./publish/app_offline.htm"
          "Site Updating..." | Out-File -FilePath $offlineFile -Encoding utf8
          
          $ftp = [System.Net.FtpWebRequest]::Create("ftp://${{ secrets.FTP_SERVER }}/wwwroot/app_offline.htm")
          $ftp.Method = [System.Net.WebRequestMethods+Ftp]::UploadFile
          $ftp.Credentials = New-Object System.Net.NetworkCredential("${{ secrets.FTP_USERNAME }}", "${{ secrets.FTP_PASSWORD }}")
          $bytes = [System.IO.File]::ReadAllBytes($offlineFile)
          $ftp.ContentLength = $bytes.Length
          $requestStream = $ftp.GetRequestStream()
          $requestStream.Write($bytes, 0, $bytes.Length)
          $requestStream.Close()
          Write-Host "Site is now OFFLINE. Waiting for IIS to release files..."
          Start-Sleep -Seconds 5

      # ШАГ 2: Заливаем файлы в 10 потоков
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: ./wwwroot/
          dangerous-clean-slate: false
          parallel: 10 

      # ШАГ 3: Удаляем заглушку
      - name: Put Site Online
        shell: pwsh
        run: |
          $ftp = [System.Net.FtpWebRequest]::Create("ftp://${{ secrets.FTP_SERVER }}/wwwroot/app_offline.htm")
          $ftp.Method = [System.Net.WebRequestMethods+Ftp]::DeleteFile
          $ftp.Credentials = New-Object System.Net.NetworkCredential("${{ secrets.FTP_USERNAME }}", "${{ secrets.FTP_PASSWORD }}")
          try { 
            $ftp.GetResponse().Close()
            Write-Host "Site is now ONLINE."
          } catch { 
            Write-Host "ℹ️ No offline file found"
          }

      # ШАГ 4: Health check - проверяем что сайт жив и БД работает
      - name: Health Check
        shell: pwsh
        run: |
          Write-Host "Waiting for site to start..."
          Start-Sleep -Seconds 10
    
          Write-Host "Checking /health endpoint..."
          $healthResponse = Invoke-WebRequest -Uri "https://agroadmin.runasp.net/health" -UseBasicParsing
          if ($healthResponse.StatusCode -ne 200) {
            Write-Host "❌ Health check failed!"
            exit 1
          }
          Write-Host "✅ Health check passed"
    
          Write-Host "Checking if site is up..."
          $homeResponse = Invoke-WebRequest -Uri "https://agroadmin.runasp.net" -UseBasicParsing
          if ($homeResponse.StatusCode -ne 200) {
            Write-Host "❌ Site not responding!"
            exit 1
          }
          Write-Host "✅ Site is up"