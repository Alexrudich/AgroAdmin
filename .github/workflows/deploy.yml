name: Build and Deploy to MonsterASP.NET

on:
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore & Build
        run: |
          dotnet restore AgroAdmin.slnx
          dotnet build AgroAdmin.slnx --configuration Release --no-restore

      - name: Publish
        run: dotnet publish AgroAdmin/AgroAdmin/AgroAdmin.csproj --configuration Release --output ./publish --runtime win-x86 --self-contained false

      - name: Deploy via MSDeploy
        shell: pwsh
        env:
          MS_SERVER: ${{ secrets.SERVER_COMPUTER_NAME }}
          MS_SITE: 'site57408'
          MS_USER: 'site57408'
          MS_PASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          $msDeployPath = "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          $publishPath = "${{ github.workspace }}\publish"
          
          # Формируем аргументы массивом, чтобы PowerShell не накосячил с кавычками
          $destArg = "contentPath=$env:MS_SITE,ComputerName=$env:MS_SERVER,UserName=$env:MS_USER,Password=$env:MS_PASS,AuthType=Basic"
          
          $params = @(
            "-verb:sync",
            "-source:contentPath=$publishPath",
            "-dest:$destArg",
            "-allowUntrusted",
            "-enableRule:DoNotDeleteRule"
          )
          
          & $msDeployPath $params
