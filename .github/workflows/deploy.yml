name: Build and Deploy to MonsterASP.NET (FTP)

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore & Build
        run: |
          dotnet restore AgroAdmin.slnx
          dotnet build AgroAdmin.slnx --configuration Release --no-restore

      - name: Publish
        run: dotnet publish AgroAdmin/AgroAdmin/AgroAdmin.csproj --configuration Release --output ./publish --runtime win-x86 --self-contained false

      # ШАГ 1: Создаем и заливаем ТОЛЬКО app_offline.htm
      - name: Put Site Offline
        shell: pwsh
        run: |
          $offlineFile = "./publish/app_offline.htm"
          "Site Updating..." | Out-File -FilePath $offlineFile -Encoding utf8
          
          $ftp = [System.Net.FtpWebRequest]::Create("ftp://${{ secrets.FTP_SERVER }}/wwwroot/app_offline.htm")
          $ftp.Method = [System.Net.WebRequestMethods+Ftp]::UploadFile
          $ftp.Credentials = New-Object System.Net.NetworkCredential("${{ secrets.FTP_USERNAME }}", "${{ secrets.FTP_PASSWORD }}")
          $bytes = [System.IO.File]::ReadAllBytes($offlineFile)
          $ftp.ContentLength = $bytes.Length
          $requestStream = $ftp.GetRequestStream()
          $requestStream.Write($bytes, 0, $bytes.Length)
          $requestStream.Close()
          Write-Host "Site is now OFFLINE. Waiting for IIS to release files..."
          Start-Sleep -Seconds 5

      # ШАГ 2: Удаляем старую версию SqlClient
      - name: Remove old SqlClient
        shell: pwsh
        run: |
          Write-Host "Removing old SqlClient.dll if exists..."
          $ftp = [System.Net.FtpWebRequest]::Create("ftp://${{ secrets.FTP_SERVER }}/wwwroot/Microsoft.Data.SqlClient.dll")
          $ftp.Method = [System.Net.WebRequestMethods+Ftp]::DeleteFile
          $ftp.Credentials = New-Object System.Net.NetworkCredential("${{ secrets.FTP_USERNAME }}", "${{ secrets.FTP_PASSWORD }}")
          try { 
            $ftp.GetResponse().Close()
            Write-Host "✅ Old SqlClient.dll removed"
          } catch { 
            Write-Host "ℹ️ No old SqlClient.dll found"
          }

      # ШАГ 3: Заливаем файлы в 10 потоков
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: ./wwwroot/
          dangerous-clean-slate: false
          parallel: 10 

      # ШАГ 4: Удаляем заглушку
      - name: Put Site Online
        shell: pwsh
        run: |
          $ftp = [System.Net.FtpWebRequest]::Create("ftp://${{ secrets.FTP_SERVER }}/wwwroot/app_offline.htm")
          $ftp.Method = [System.Net.WebRequestMethods+Ftp]::DeleteFile
          $ftp.Credentials = New-Object System.Net.NetworkCredential("${{ secrets.FTP_USERNAME }}", "${{ secrets.FTP_PASSWORD }}")
          try { 
            $ftp.GetResponse().Close()
            Write-Host "Site is now ONLINE."
          } catch { 
            Write-Host "ℹ️ No offline file found"
          }